[project]
name = "bright-smiles-dental"
version = "1.0.0"
description = "Bright Smiles Dental – Pipecat voice agent (Mia)"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[deepgram,openai,elevenlabs,silero,websocket,smallwebrtc]>=0.0.105",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "twilio>=9.0.0",
    "loguru>=0.7.0",
    "aiohttp>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
